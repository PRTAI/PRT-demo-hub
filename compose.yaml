name: prt-datahub
services:
  app:
    build: .
    image: prt-datahub:local
    container_name: prt-datahub
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRT_PORT:-8080}:3100"
    environment:
      NODE_ENV: development
      DEMO_MODE: "true"
      CONTAINER_PREVIEW: "true"
      HOST: 0.0.0.0
      PORT: "3100"
      APP_ORIGIN: http://127.0.0.1:${PRT_PORT:-8080}
      DATA_DIR: /app/data
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_ENABLE_THINKING: ${DEEPSEEK_ENABLE_THINKING:-false}
      RAG_LLM_MAX_TOKENS: ${RAG_LLM_MAX_TOKENS:-}
      RAG_LLM_REQUEST_TIMEOUT_MS: ${RAG_LLM_REQUEST_TIMEOUT_MS:-90000}
      DESCRIPTION_AGENT_MAX_TOKENS: ${DESCRIPTION_AGENT_MAX_TOKENS:-}
      DESCRIPTION_AGENT_TIMEOUT_MS: ${DESCRIPTION_AGENT_TIMEOUT_MS:-180000}
      DESCRIPTION_AGENT_REQUEST_TIMEOUT_MS: ${DESCRIPTION_AGENT_REQUEST_TIMEOUT_MS:-90000}
    volumes:
      - preview-data:/app/data
      - preview-backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  preview-data:
  preview-backups:
