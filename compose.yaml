name: prt-datahub
services:
  app:
    build: .
    image: prt-datahub:local
    container_name: prt-datahub
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRT_PORT:-8080}:3100"
    environment:
      NODE_ENV: development
      DEMO_MODE: "true"
      CONTAINER_PREVIEW: "true"
      HOST: 0.0.0.0
      PORT: "3100"
      APP_ORIGIN: http://127.0.0.1:${PRT_PORT:-8080}
      DATA_DIR: /app/data
    volumes:
      - preview-data:/app/data
      - preview-backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  preview-data:
  preview-backups:
