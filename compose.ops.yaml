services:
  app:
    environment:
      OPS_ENABLED: "true"
      OPS_WORKER_URL: http://ops-worker:3200
      OPS_WORKER_TOKEN: ${OPS_WORKER_TOKEN:?Set a random OPS_WORKER_TOKEN of at least 32 bytes}
      OPS_BACKUP_DIR: /app/ops-backups
    volumes:
      - type: bind
        source: ${OPS_HOST_BACKUP_DIR:-J:/PRT-backups/ops}
        target: /app/ops-backups
    networks:
      - default
      - ops-internal
  ops-worker:
    build:
      context: .
      dockerfile: Dockerfile.ops
    image: prt-datahub:ops
    init: true
    restart: unless-stopped
    environment:
      OPS_WORKER_TOKEN: ${OPS_WORKER_TOKEN:?Set OPS_WORKER_TOKEN}
    volumes:
      - ops-workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 192
    mem_limit: 2g
    cpus: 2
    networks:
      - ops-internal
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
volumes:
  ops-workspace:
networks:
  ops-internal:
    internal: true
