# Standalone production configuration; do not merge with the preview file.
name: prt-datahub-production
services:
  app:
    build: .
    image: prt-datahub:production
    container_name: prt-datahub-production
    init: true
    restart: unless-stopped
    ports:
      - "0.0.0.0:8001:3100"
    environment:
      NODE_ENV: development
      DEMO_MODE: "false"
      CONTAINER_PREVIEW: "false"
      HOST: 0.0.0.0
      PORT: "3100"
      DATA_DIR: /app/data
      APP_ORIGIN: ${APP_ORIGIN:?Set the application origin}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-http://data.prt-ai.cn:8001}
      INTRANET_APP_ORIGIN: ${INTRANET_APP_ORIGIN:-http://192.168.110.25:8001}
      FEISHU_APP_ID: ${FEISHU_APP_ID:?Set the Feishu application ID}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:?Set the Feishu application secret}
      FEISHU_TENANT_KEY: ${FEISHU_TENANT_KEY:?Set the allowed enterprise tenant key}
      FEISHU_DOCUMENT_PREVIEW: ${FEISHU_DOCUMENT_PREVIEW:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_ENABLE_THINKING: ${DEEPSEEK_ENABLE_THINKING:-false}
      RAG_LLM_MAX_TOKENS: ${RAG_LLM_MAX_TOKENS:-}
      RAG_LLM_REQUEST_TIMEOUT_MS: ${RAG_LLM_REQUEST_TIMEOUT_MS:-90000}
      DESCRIPTION_AGENT_MAX_TOKENS: ${DESCRIPTION_AGENT_MAX_TOKENS:-}
      DESCRIPTION_AGENT_TIMEOUT_MS: ${DESCRIPTION_AGENT_TIMEOUT_MS:-180000}
      DESCRIPTION_AGENT_REQUEST_TIMEOUT_MS: ${DESCRIPTION_AGENT_REQUEST_TIMEOUT_MS:-90000}
      BOOTSTRAP_ADMIN_OPEN_IDS: ${BOOTSTRAP_ADMIN_OPEN_IDS:-}
    volumes:
      - production-data:/app/data
      - production-backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  production-data:
  production-backups:
